name: Autonomize Healthcare AI Test Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  automation-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Start FastAPI Server
        run: |
          nohup uvicorn app.mock_api:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 10

      - name: Print Uvicorn Logs
        run: |
          cat uvicorn.log

      - name: Verify FastAPI Server
        run: |
          curl http://127.0.0.1:8000/docs

      - name: Run Pytest Automation
        env:
          BASE_URL: http://127.0.0.1:8000
          REQUEST_TIMEOUT: 10
        run: pytest -v --html=reports/report.html

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/report.html